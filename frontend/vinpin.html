<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VINPIN</title>
    <link rel="stylesheet" href="style/vinpin_style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo-block">
            <img src="img/logo.png" alt="VINPIN" class="logo-img">
        </div>
        <div class="menu-block">
            <a href="#" class="menu-link">Главная</a>
            <a href="#" class="menu-link">Сотрудники</a>
            <a href="#" class="menu-link">Аналитика</a>
        </div>
    </header>
    <main>
        <div class="passport-block">
            <div class="passport-img-block">
                <img src="img/people/1.png" alt="" class="passport-img">
            </div>
            <div class="passport-desk">
                <span class="people-name">ИИИИ ИИИИИИИ ИИИИИИ</span>
                <br>
                <span class="people-desc">Начало работы:</span><span class="people-work people-red"></span>
                <br>
                <span class="people-desc">Должность:</span><span class="people-work people-red"></span>
                <br>
                <span class="people-desc">Количество звонков:</span><span class="people-calls-count people-red"></span>
                <br>
                <span class="people-desc">Процент успешных звонков:</span><span class="people-success people-red"></span>
                <br>
                <span class="people-desc">Средняя продолжительность разговора:</span><span class="people-duration people-red"></span>
                <br>
                <span class="people-desc">Эмоциональный индекс:</span><span class="people-index people-red"></span>
                <br>
                <span class="people-desc">Баллы:</span><span class="people-scores people-red"></span>
                <br>
                <span class="people-desc">Рекомендации:</span><span class="people-recom people-red"></span>
            </div>
        </div>
    </main>
    <script src="scripts/vinpin.js"></script>
</body>
</html>
